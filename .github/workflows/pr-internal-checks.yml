name: Internal PR Checks

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review, labeled, unlabeled]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  checks:
    if: ${{ github.event.repository.private }}
    uses: Arm-Debug/github-workflow-wizardry/.github/workflows/internal-checks.yml@3ec9aeb477e260cfe18ab3ee9c0488ff508bd14e
    with:
      internal_scan: true
      internal_review: true
    secrets: inherit
