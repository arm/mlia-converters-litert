[build-system]
requires = ["hatchling", "uv-dynamic-versioning", "mlia>=0.14.0,<0.15.0"]
build-backend = "hatchling.build"

[project]
name = "mlia-runtime-litert"
dynamic = ["version"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "tosa-converter-for-tflite==2026.2.0",
    "rich==13.7.1"
]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
dirty = true
bump = true

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.hooks.custom]
path = "../package_hook.py"
modules = ["mlia.backend.tosa_converter_for_tflite.worker"]

[tool.hatch.build.targets.wheel.force-include]
"../../LICENSES/Apache-2.0.txt" = "mlia_runtime_assets/resources/licenses/Apache-2.0.txt"

[tool.mlia.runtime]
id = "arm/litert/public"
label = "LiteRT conversion runtime"
python = "3.12"
architectures = ["x86_64"]

[tool.mlia.runtime.operations."litert/tflite-to-tosa"]
label = "LiteRT conversion"
entrypoint = "mlia.backend.tosa_converter_for_tflite.worker:run"
result_schema = "model/1"
