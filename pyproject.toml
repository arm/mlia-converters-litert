[build-system]
requires = [
    "hatchling>=1.27.0",
    "uv-dynamic-versioning>=0.8.2,<0.9.0"
]
build-backend = "hatchling.build"

[project]
name = "mlia-converters-tflite"
dynamic = ["version"]
description = "ML Inference Advisor TFLite Converter Plugin"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSES/*.txt"]
authors = [
    {name = "Arm Ltd", email = "mlia@arm.com"}
]
keywords = ["ml", "arm", "tflite", "tosa"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "mlia>=0.11.0.dev0"
]

[project.urls]
Homepage = "https://github.com/arm/mlia-tflite-converters.git"

[project.entry-points."mlia.plugin.converter"]
tflite_to_tosa = "mlia.backend.tosa_converter_for_tflite.converter_plugin:TFLiteToTosaConverterPlugin"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
# Include implicit namespace packages under src/.
only-include = ["src/mlia"]
sources = ["src"]
artifacts = ["src/mlia/_vendor/artifacts/tosa-converter-for-tflite/*.whl"]

[tool.hatch.build.targets.sdist]
include = [
    "src/mlia/**",
    "LICENSES/*.txt"
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
pattern = "default-unprefixed"
bump = true
fallback-version = "0.0.0.dev0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.blocklint]
max_issue_threshold = 1
blocklist = ["master", "slave", "blacklist", "whitelist", "dummy"]
wordlist = ["he", "she", "him", "her", "his", "hers"]
skip_files = ["LICENSES/Apache-2.0.txt", "docs/source/conf.py", "pyproject.toml"]

[tool.mypy]
# Suppress errors for optional dependencies and cross-repo imports.
ignore_missing_imports = true

[dependency-groups]
test = [
    "pytest==8.3.2",
    "flaky~=3.8.1",
    "pytest-cov==5.0.0"
]
dev = [
    {include-group = "test"},
    "mypy==1.5.1",
    "pre-commit==4.5.1",
    "blocklint",
    "build~=1.2.1",
    "tomli>=2.0.1; python_version<'3.11'"
]
docs = [
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.5,<10.0",
    "pymdown-extensions>=10.0,<11.0"
]
