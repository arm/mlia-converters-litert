[build-system]
requires = [
    "hatchling==1.32.4",
    "uv-dynamic-versioning==0.14.1"
]
build-backend = "hatchling.build"

[project]
name = "mlia-converters-litert"
dynamic = ["version", "readme"]
description = "ML Inference Advisor LiteRT Converter Plugin"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
license-files = ["LICENSES/*.txt"]
authors = [
    { name = "Arm Ltd", email = "mlia@arm.com" }
]
keywords = ["ml", "arm", "litert", "tflite", "tosa"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "mlia>=0.12.0,<0.13",
    "tosa-converter-for-tflite==2026.2.0"
]

[project.urls]
Homepage = "https://github.com/arm/mlia-converters-litert.git"

[project.entry-points."mlia.plugin.transformer"]
tflite_to_tosa = "mlia.backend.tosa_converter_for_tflite.converter_plugin:TFLiteToTosaConverterPlugin"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
# Include implicit namespace packages under src/.
only-include = ["src/mlia"]
sources = ["src"]
exclude = ["src/mlia/_vendor/**"]

[tool.hatch.build.targets.sdist]
include = [
    "src/mlia/**",
    "LICENSES/*.txt",
    "README.md",
    "hatch_build.py"
]
exclude = ["src/mlia/_vendor/**"]

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
pattern = "default-unprefixed"
bump = true
fallback-version = "0.0.0.dev0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.blocklint]
max_issue_threshold = 1
blocklist = ["master", "slave", "blacklist", "whitelist", "dummy"]
wordlist = ["he", "she", "him", "her", "his", "hers"]
skip_files = ["LICENSES/Apache-2.0.txt", "docs/source/conf.py", "pyproject.toml"]

# Keep the existing lint rules when upgrading Ruff.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
# Suppress errors for optional dependencies and cross-repo imports.
ignore_missing_imports = true

[dependency-groups]
test = [
    "pytest==9.1.1",
    "flaky==3.8.1",
    "pytest-cov==7.1.0",
    "hatchling==1.32.4"
]
dev = [
    { include-group = "test" },
    "mypy==2.3.1",
    "pre-commit==4.6.2",
    "blocklint==0.3.0",
    "build==1.6.1",
    "tomli==2.4.1; python_version<'3.11'"
]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
    "pymdown-extensions==12.0.1"
]
